name: recuperer
on:
  push:
    paths: ['.github/urls.txt']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _tmp
          while read u; do curl -sSL "$u" -o "_tmp/$(basename "$u")"; done < .github/urls.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add _tmp && git commit -m "tmp" && git push
