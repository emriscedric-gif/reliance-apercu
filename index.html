<script>
(function () {
  "use strict";
  var racine = document.getElementById("demo-page");
  function comportements() {
    // onglet actif visible sur téléphone (menu défilant)
    var actif = racine.querySelector(".nav a.on");
    if (actif && window.matchMedia("(max-width: 760px)").matches) actif.scrollIntoView({ inline: "center", block: "nearest" });
    // une seule question ouverte à la fois dans les FAQ
    racine.querySelectorAll("details.faq").forEach(function (d) {
      d.addEventListener("toggle", function () {
        if (!d.open) return;
        racine.querySelectorAll("details.faq[open]").forEach(function (o) { if (o !== d) o.open = false; });
      });
    });
  }
  function afficher() {
    var id = (location.hash || "#accueil").slice(1) || "accueil";
    var modele = document.getElementById("t-" + id);
    if (!modele) {
      var cible = document.getElementById(id);           // ancre à l'intérieur de la page affichée
      if (cible && racine.contains(cible)) { cible.scrollIntoView({ behavior: "smooth" }); return; }
      modele = document.getElementById("t-accueil");
    }
    racine.innerHTML = modele.innerHTML;
    document.body.className = modele.getAttribute("data-classe");
    document.title = modele.getAttribute("data-titre");
    window.scrollTo(0, 0);
    comportements();
  }
  window.addEventListener("hashchange", afficher);
  // Formulaires : rien n'est envoyé dans cet aperçu
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, note = f.querySelector(".demo-note");
    if (!note) { note = document.createElement("p"); note.className = "demo-note"; f.appendChild(note); }
    note.textContent = "Aperçu de démonstration : sur le site en ligne, ce formulaire transmet la demande au cabinet et le visiteur reçoit un accusé de réception par e-mail.";
  }, true);
  afficher();
})();
</script>
